name: NHL Daily Refresh

on:
  schedule:
    # Runs at 11:00 AM UTC (after most NHL games finish ~6 AM UTC)
    - cron: '0 11 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-and-persist:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create data directory
        run: mkdir -p data

      # ── Restore DB from prior run artifact ──────────────────────────
      - name: Download previous DB (if any)
        uses: actions/download-artifact@v4
        with:
          name: nhl-pipeline-db
          path: data/
        continue-on-error: true

      # ── Fetch real data from the NHL API ────────────────────────────
      - name: "Step 1/4: Fetch schedule and rosters (last 10 days)"
        run: python run_pipeline.py daily

      - name: "Step 2/4: Fetch player game logs"
        run: python run_pipeline.py gamelogs

      - name: "Step 3/4: Fetch team and goalie stats"
        run: python run_pipeline.py gamestats --season
        continue-on-error: true

      - name: "Step 4/4: Retrain model"
        run: python run_pipeline.py train --model data/model.pkl
        continue-on-error: true

      # ── Persist the DB as an artifact ───────────────────────────────
      - name: Upload pipeline data artifact
        uses: actions/upload-artifact@v4
        with:
          name: nhl-pipeline-db
          path: |
            data/*.db
            data/*.pkl
          retention-days: 90
          overwrite: true

      # ── Also commit the DB to the repo for easy access ──────────────
      - name: Commit data to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add --force data/nhl_pipeline.db
          git add --force data/model.pkl 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore: update NHL data $(date -u +%Y-%m-%d)"
            git push
          fi

      # ── Show summary ────────────────────────────────────────────────
      - name: Pipeline summary
        if: always()
        run: |
          echo "## NHL Pipeline Run Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Date:** $(date -u +%Y-%m-%d)" >> "$GITHUB_STEP_SUMMARY"
          if [ -f data/nhl_pipeline.db ]; then
            DB_SIZE=$(du -h data/nhl_pipeline.db | cut -f1)
            echo "- **DB size:** $DB_SIZE" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f data/model.pkl ]; then
            MODEL_SIZE=$(du -h data/model.pkl | cut -f1)
            echo "- **Model size:** $MODEL_SIZE" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Run \`python run_pipeline.py streak-tiers --real-players\` locally to view streaks." >> "$GITHUB_STEP_SUMMARY"
